<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0d2e">
    <title>For Tina 💕</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        p,
        span {
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>

<body>
    <canvas id="galaxyCanvas"></canvas>
    <div class="star-dust" aria-hidden="true"></div>
    <audio id="bgAudio" src="love-song.mp3" crossorigin="anonymous"></audio>

    <div id="container">
        <div id="content-overlay">
            <h1>Tina</h1>
            <p class="subtitle">A Galaxy of Love</p>
            <div class="message">
                <p>You are my universe 💕</p>
                <button id="galleryBtn" class="gallery-button">Explore the stars ✨</button>
            </div>
            <div class="love-quote">
                <p>"In a galaxy of stars, you're my favorite constellation" 💫</p>
            </div>

            <section id="explore-stars" class="explore-stars">
                <h2>Explore the Stars</h2>
                <div class="slider-frame">
                    <img id="starPhoto" class="slider-photo" src="" alt="Galaxy memory">
                </div>
                <div class="caption-box">
                    <p id="captionText"></p>
                </div>
                <p class="slider-hint">Swipe left or right to travel</p>
            </section>
        </div>
    </div>

    <button id="loveButton" class="love-button" aria-label="Send love">❤</button>
    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <script src="script.js"></script>
</body>

</html>
